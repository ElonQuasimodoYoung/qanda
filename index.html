<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12382d">
  <title>问答备忘</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312382d'/%3E%3Cpath d='M18 24h28v6H18zm0 10h20v6H18zm0 10h24v6H18z' fill='%23f3efe6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" class="app">
    <header class="top">
      <div>
        <h1>问答备忘</h1>
        <p class="sub" id="intro">题目按 13 份材料里的出现次数分成高频、中频和低频。写出的答案会留在这台浏览器里，关掉页面也不会丢。换电脑前先下载一份备份。</p>
      </div>
      <div class="top-actions no-print">
        <button class="btn secondary" id="backup" type="button">下载备份</button>
        <label class="btn secondary file-btn">恢复备份<input id="restore" type="file" accept="application/json,.json" hidden></label>
      </div>
    </header>

    <section class="stats" aria-label="完成进度">
      <div class="stat">
        <b id="done-count">0 / 0</b>
        <span>已填写</span>
        <div class="bar" aria-hidden="true"><i id="done-bar"></i></div>
      </div>
      <div class="stat high"><b id="count-high">0</b><span>高频 · 6 次及以上</span></div>
      <div class="stat mid"><b id="count-mid">0</b><span>中频 · 3 到 5 次</span></div>
      <div class="stat low"><b id="count-low">0</b><span>低频 · 1 到 2 次</span></div>
    </section>

    <section class="panel">
      <div class="profile">
        <div class="field">
          <label for="who">填写人</label>
          <input id="who" type="text" maxlength="40" placeholder="你的名字或称呼" autocomplete="name">
        </div>
        <div class="field">
          <label for="partner">伴侣</label>
          <input id="partner" type="text" maxlength="40" placeholder="对方的名字或称呼" autocomplete="off">
        </div>
      </div>
      <div class="sync no-print" id="sync" hidden>
        <div class="sync-info">
          <span class="sync-label">同步码</span>
          <code class="sync-code" id="sync-code"></code>
          <p class="note">把邀请链接发给伴侣，或在另一台设备输入这个同步码，就能看到同一份答案。拿到同步码的人都能看和改，不要公开发出去。</p>
        </div>
        <div class="sync-actions">
          <button class="btn secondary" id="sync-copy" type="button">复制邀请链接</button>
          <form class="sync-join" id="sync-join">
            <input id="sync-input" type="text" placeholder="粘贴邀请链接或同步码" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="同步码">
            <button class="btn" type="submit">加入</button>
          </form>
        </div>
      </div>
    </section>

    <div class="toolbar">
      <div class="chips" id="filters" role="toolbar" aria-label="按频率筛选">
        <button class="chip" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button class="chip" type="button" data-filter="high" aria-pressed="false">高频</button>
        <button class="chip" type="button" data-filter="mid" aria-pressed="false">中频</button>
        <button class="chip" type="button" data-filter="low" aria-pressed="false">低频</button>
        <button class="chip" type="button" data-filter="blank" aria-pressed="false">未填写</button>
      </div>
      <div class="search">
        <input id="search" type="search" placeholder="搜索问题" enterkeyhint="search">
      </div>
    </div>

    <div id="list"></div>
    <p class="empty" id="empty" hidden>没有符合条件的问题。</p>

    <div class="dock no-print">
      <span id="dock-status">答案会自动留在这台浏览器</span>
      <div class="row">
        <button class="btn secondary" id="clear" type="button">清空答案</button>
        <button class="btn" id="export" type="button">导出 PDF</button>
      </div>
    </div>
  </main>

  <article id="print-sheet" class="print-sheet"></article>
  <script src="js/sync-config.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
